<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#B5502E" />
    <meta name="description" content="Gestão operacional da Espetaria Sabor da Carne" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <title>Ponto</title>
    <link rel="preconnect" href="https://byamgmjeqawznkagouwd.supabase.co" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"><div data-splash style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#F8F5EE;color:#B5502E;font-family:sans-serif;font-size:28px;font-weight:600">Ponto</div></div>
    <script>
      // Cardápio: mostra a logo antes de qualquer script carregar
      if (/^\/cardapio\/?$/.test(location.pathname)) {
        document.documentElement.style.background = '#17120f';
        document.getElementById('root').innerHTML = '<div style="min-height:100vh;background:#17120f;display:flex;justify-content:center;padding-top:60px"><img src="/brand/logo-sabor-da-carne-288.webp" alt="" width="128" height="128" style="height:128px;border-radius:50%;border:2px solid #e8b64a"></div>';
      }
    </script>
    <script>
      (function() {
        var isRecovering = false;
        function forceCleanReload() {
          if (isRecovering) return;
          isRecovering = true;
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
          } catch (e) {}
          var lastRecover = sessionStorage.getItem('ponto_auto_recover');
          var now = Date.now();
          if (!lastRecover || (now - parseInt(lastRecover, 10)) > 8000) {
            sessionStorage.setItem('ponto_auto_recover', now.toString());
            window.location.reload(true);
          }
        }

        window.addEventListener('error', function(e) {
          var target = e.target;
          // Só arquivos do próprio sistema: fonte do Google fora do ar ou erro de dados não pode apagar o cache
          var resource = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK') ? (target.src || target.href || '') : '';
          var isTag = resource.indexOf(window.location.origin + '/assets/') === 0;
          var msg = (e.message || '').toLowerCase();
          var isOldBundle = msg.indexOf('unexpected token') !== -1 && (e.filename || '').indexOf('/assets/') !== -1;
          if (isTag || isOldBundle || msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('loading chunk') !== -1) {
            forceCleanReload();
          }
        }, true);

        // Se após 20s o React ainda não tiver montado nada (tela em branco por cache antigo).
        // Internet lenta demora mesmo: antes de 20s apagar o cache só deixaria o celular mais lento.
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (root.querySelector('[data-splash]') || !root.innerHTML || root.innerHTML.trim() === '')) {
            var lastRecover = sessionStorage.getItem('ponto_auto_recover');
            var now = Date.now();
            if (!lastRecover || (now - parseInt(lastRecover, 10)) > 8000) {
              forceCleanReload();
            } else {
              root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;padding:24px;text-align:center;background:#F8F5EE;color:#2B211C;"><h2 style="font-size:20px;font-weight:700;margin-bottom:8px;color:#2B211C;">Atualizando para a nova versão...</h2><p style="font-size:14px;color:#6B5D53;margin-bottom:20px;max-width:320px;">O sistema foi atualizado na nuvem. Clique no botão abaixo para carregar imediatamente:</p><button onclick="window.location.reload(true)" style="background:#B5502E;color:#fff;border:none;padding:12px 28px;border-radius:10px;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(181,80,46,0.3);">Atualizar agora</button></div>';
            }
          }
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
